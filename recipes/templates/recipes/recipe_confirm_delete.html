{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="text-center">
        <h1 class="text-danger">Delete Recipe</h1>
        <p>Are you sure you want to delete "<strong>{{ object.title }}</strong>"?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
            <a href="{% url 'recipe_detail' pk=object.pk %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

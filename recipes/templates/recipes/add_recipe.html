{% extends "base.html" %}

{% block title %}Add Recipe{% endblock %}

{% block content %}

<div class="container">
    <form class="p-2 form" method="POST" enctype="multipart/form-data">
        <h1 class="text-center">Add Recipe</h1>
        {% csrf_token %}
        {{ form.media }}
        {{ form|crispy }}
        <div class="text-center">
            <button class="btn btn-primary mt-2" type="submit">Create Recipe</button>
        </div>
    </form>
</div>

{% endblock %}

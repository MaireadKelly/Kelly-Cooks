{% extends "base.html" %}

{% block title %}Add Recipe{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 shadow-sm p-4 bg-white rounded">
                <h1 class="text-center">Add Recipe</h1>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.media }}
                    {{ form|crispy }}
                    <div class="text-center mt-3">
                        <button class="btn btn-primary w-100" type="submit">Create Recipe</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

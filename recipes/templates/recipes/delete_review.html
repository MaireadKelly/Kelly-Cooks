{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 shadow-sm p-4 bg-white rounded text-center">
            <h2>Confirm Delete</h2>
            <p class="text-danger">Are you sure you want to delete this review?</p>

            <div class="alert alert-warning">
                This action cannot be undone.
            </div>

            <div>
                <a href="{% url 'recipe_detail' review.recipe.id %}" class="btn btn-secondary w-100">Cancel</a>
                <form method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100 mt-2">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

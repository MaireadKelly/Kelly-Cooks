{% extends 'base.html' %}

{% block title %}Edit Review{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 shadow-sm p-4 bg-white rounded">
            <h2 class="text-center">Edit Your Review</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-primary w-100">Update Review</button>
                    <a href="{% url 'recipe_detail' pk=review.recipe.id %}" class="btn btn-secondary w-100 mt-2">Back to Recipe</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

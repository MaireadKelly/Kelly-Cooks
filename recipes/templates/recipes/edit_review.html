{% extends 'base.html' %}

{% block title %}Edit Review{% endblock %}

{% block content %}
<h2>Edit Your Review</h2>
<form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Update Review</button>
</form>
<a href="{% url 'recipe_detail' pk=review.recipe.id %}">Back to Recipe</a>
{% endblock %}

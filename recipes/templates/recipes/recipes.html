{% extends "base.html" %} 

{% block title %}Recipes{% endblock %}

{% block content %} 
    <h1 class="text-center p-2 d-block">
        Latest Recipes
    </h1>
    <div class="container d-flex flex-row flex-wrap justify-content-center">
    {% for recipe in recipes %}
        <div class="card m-3 d-flex flex-column" style="width: 18rem;">
            <img src="{{ recipe.image.url }}" class="card-img-top" alt="{{ recipe.image_alt }}">
            <div class="card-body flex-grow-1">
                <h2 class="card-title">{{ recipe.title }}</h2>
                <p class="card-text">{{ recipe.description|truncatechars:100 }}</p>
            </div>
            <div class="d-flex justify-content-center mt-auto mb-3">
                <a href="{% url 'recipe_detail' recipe.id %}" class="btn btn-primary" aria-label="Click to view {{ recipe.title }}">
                    View Recipe
                </a>
            </div>
        </div>
    {% endfor %}
    </div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-danger text-center">Delete Recipe</h1>
    <p class="text-center">Are you sure you want to delete "<strong>{{ object.title }}</strong>"?</p>
    <form method="POST" class="text-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'recipe_detail' pk=object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>
         {% block title %}Kelly Cooks{% endblock %}
      </title>
      <!-- Favicon -->
      <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
      <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
      <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
      <link
         rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
      <!-- Google Fonts -->
      <link
         href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@300;500&family=Sour+Gummy&display=swap" rel="stylesheet">
      <!-- Bootstrap CSS -->
      <link
         rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
      <!-- Custom CSS -->
      <link rel="stylesheet" href="{% static 'css/base.css' %}">
   </head>
   <body>
      {% include "includes/header.html" %}
      <!-- Include the header file -->
      <main
         class="container my-5">
         <!-- Success / Error Messages -->
         {% if messages %}
         <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
               {{ message }}
               <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
         </div>
         {% endif %}
         {% block content %}<!-- Page-specific content goes here -->{% endblock %}
      </main>
      {% include "includes/footer.html" %}
      <!-- Include the footer file -->
      <!-- Bootstrap Bundle JS --><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"> </script>
   </body>
</html>

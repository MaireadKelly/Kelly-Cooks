{% extends "base.html" %}
{% load i18n %}
{% block title %}
    {% trans "Sign Out" %}
{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 shadow-sm p-4 bg-white rounded text-center">
                <h1 class="mb-3">{% trans "Sign Out" %}</h1>
                <p class="mb-4">{% trans 'Are you sure you want to sign out?' %}</p>

                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}

                    {% if redirect_field_value %}
                        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                    {% endif %}

                    <button type="submit" class="btn btn-primary w-100">
                        {% trans 'Sign Out' %}
                    </button>
                    <a href="{% url 'home' %}" class="btn btn-secondary w-100 mt-2">
                        {% trans "Cancel" %}
                    </a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
